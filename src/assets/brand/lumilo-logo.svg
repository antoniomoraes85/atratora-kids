<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" role="img" aria-label="Lumilo">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Star mascot icon -->
  <g transform="translate(8, 8)">
    <!-- Star body -->
    <path d="M32 4 L38 20 L56 22 L44 34 L47 52 L32 44 L17 52 L20 34 L8 22 L26 20 Z"
      fill="url(#starGrad)" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Eyes -->
    <circle cx="25" cy="28" r="2.5" fill="#1E293B"/>
    <circle cx="26" cy="27" r="1" fill="white"/>
    <circle cx="39" cy="28" r="2.5" fill="#1E293B"/>
    <circle cx="40" cy="27" r="1" fill="white"/>
    <!-- Smile -->
    <path d="M26 35 Q32 41 38 35" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <ellipse cx="20" cy="33" rx="4" ry="3" fill="#F43F5E" opacity="0.4"/>
    <ellipse cx="44" cy="33" rx="4" ry="3" fill="#F43F5E" opacity="0.4"/>
    <!-- Sparkles -->
    <circle cx="52" cy="10" r="2" fill="#38BDF8"/>
    <circle cx="10" cy="14" r="1.5" fill="#A78BFA"/>
  </g>

  <!-- Wordmark "Lumilo" -->
  <text
    x="74" y="56"
    font-family="ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif"
    font-size="46"
    font-weight="800"
    fill="url(#textGrad)"
    letter-spacing="-1"
  >Lumilo</text>
</svg>
