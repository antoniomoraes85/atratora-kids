  <circle cx="70" cy="100" r="8" fill="#374151"/>
  <circle cx="70" cy="100" r="3" fill="#6B7280"/>
  <!-- Front plow -->
  <path d="M86 68 L108 76 L108 88 L86 96" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
  <!-- Coupling -->
  <rect x="108" y="80" width="8" height="6" rx="2" fill="#6B7280"/>
