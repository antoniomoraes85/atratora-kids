<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Track -->
  <rect x="10" y="100" width="100" height="12" rx="6" fill="#6B7280"/>
  <!-- Rail ties -->
  <rect x="14" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="26" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="38" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="50" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="62" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="74" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="86" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
  <rect x="98" y="100" width="6" height="12" rx="2" fill="#4B5563"/>
