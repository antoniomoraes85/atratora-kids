  <rect x="38" y="50" width="12" height="14" rx="4" fill="#BAE6FD" opacity="0.9"/>
  <!-- Train windows body -->
  <rect x="58" y="70" width="14" height="16" rx="4" fill="#BAE6FD" opacity="0.9"/>
  <rect x="76" y="70" width="8" height="16" rx="4" fill="#BAE6FD" opacity="0.8"/>
