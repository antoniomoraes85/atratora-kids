<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="22" ry="4" fill="#0F172A" opacity="0.12"/>
  <!-- String -->
  <line x1="60" y1="10" x2="60" y2="68" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top disc -->
  <ellipse cx="60" cy="72" rx="28" ry="10" fill="#6366F1"/>
  <ellipse cx="60" cy="72" rx="20" ry="6" fill="#818CF8"/>
  <!-- Axle / center groove -->
  <rect x="50" y="78" width="20" height="8" rx="2" fill="#4338CA"/>
  <!-- Bottom disc -->
  <ellipse cx="60" cy="90" rx="28" ry="10" fill="#6366F1"/>
  <ellipse cx="60" cy="90" rx="20" ry="6" fill="#818CF8"/>
  <!-- Shine top -->
  <ellipse cx="52" cy="69" rx="6" ry="3" fill="white" opacity="0.25"/>
  <!-- Center knot on string -->
  <circle cx="60" cy="20" r="4" fill="#F59E0B"/>
  <!-- Finger loop circle -->
  <circle cx="60" cy="10" r="5" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
</svg>
