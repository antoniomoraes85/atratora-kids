<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="40" ry="4" fill="#0F172A" opacity="0.10"/>
  <!-- Puzzle board background -->
  <rect x="14" y="14" width="92" height="92" rx="8" fill="#FBBF24"/>
  <!-- Puzzle piece 1 (top-left) -->
  <rect x="18" y="18" width="42" height="42" rx="4" fill="#F97316"/>
  <!-- Nub right -->
  <circle cx="62" cy="39" r="8" fill="#F97316"/>
  <!-- Nub bottom -->
  <circle cx="39" cy="62" r="8" fill="#F97316"/>
  <!-- Puzzle piece 2 (top-right) -->
  <rect x="60" y="18" width="42" height="42" rx="4" fill="#EF4444"/>
  <!-- Socket left (cut out from piece 2) -->
  <circle cx="62" cy="39" r="6" fill="#FBBF24"/>
  <!-- Nub bottom -->
  <circle cx="81" cy="62" r="8" fill="#EF4444"/>
  <!-- Puzzle piece 3 (bottom-left) -->
  <rect x="18" y="60" width="42" height="42" rx="4" fill="#10B981"/>
  <!-- Socket top (cut out) -->
  <circle cx="39" cy="62" r="6" fill="#FBBF24"/>
  <!-- Nub right -->
  <circle cx="62" cy="81" r="8" fill="#10B981"/>
  <!-- Puzzle piece 4 (bottom-right) -->
  <rect x="60" y="60" width="42" height="42" rx="4" fill="#8B5CF6"/>
  <!-- Socket top -->
  <circle cx="81" cy="62" r="6" fill="#FBBF24"/>
  <!-- Socket left -->
  <circle cx="62" cy="81" r="6" fill="#FBBF24"/>
  <!-- Shine on piece 1 -->
  <ellipse cx="28" cy="26" rx="8" ry="5" fill="white" opacity="0.18"/>
</svg>
