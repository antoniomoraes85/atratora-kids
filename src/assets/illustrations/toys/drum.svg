<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="34" ry="4" fill="#0F172A" opacity="0.12"/>
  <!-- Left drumstick -->
  <rect x="16" y="18" width="8" height="48" rx="4" fill="#92400E" transform="rotate(-20 20 42)"/>
  <circle cx="12" cy="16" r="6" fill="#D97706"/>
  <!-- Right drumstick -->
  <rect x="96" y="18" width="8" height="48" rx="4" fill="#92400E" transform="rotate(20 100 42)"/>
  <circle cx="108" cy="16" r="6" fill="#D97706"/>
  <!-- Drum body -->
  <ellipse cx="60" cy="58" rx="44" ry="16" fill="#DC2626"/>
  <rect x="16" y="58" width="88" height="48" fill="#DC2626"/>
  <ellipse cx="60" cy="106" rx="44" ry="16" fill="#B91C1C"/>
  <!-- Drum bands -->
  <rect x="16" y="68" width="88" height="8" fill="#F97316"/>
  <rect x="16" y="86" width="88" height="8" fill="#F97316"/>
  <!-- Drum head (top membrane) -->
  <ellipse cx="60" cy="58" rx="44" ry="16" fill="#FEF3C7" opacity="0.9"/>
  <!-- Drum head shine -->
  <ellipse cx="44" cy="54" rx="14" ry="6" fill="white" opacity="0.2"/>
  <!-- Drum head center dot -->
  <circle cx="60" cy="58" r="6" fill="#F59E0B" opacity="0.5"/>
  <!-- Rim bolts -->
  <circle cx="20" cy="58" r="3" fill="#92400E"/>
  <circle cx="36" cy="48" r="3" fill="#92400E"/>
  <circle cx="60" cy="44" r="3" fill="#92400E"/>
  <circle cx="84" cy="48" r="3" fill="#92400E"/>
  <circle cx="100" cy="58" r="3" fill="#92400E"/>
</svg>
