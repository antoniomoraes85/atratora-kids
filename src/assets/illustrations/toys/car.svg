<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Car shadow -->
  <ellipse cx="60" cy="115" rx="44" ry="6" fill="#0F172A" opacity="0.14"/>
  <!-- Car body lower -->
  <rect x="10" y="68" width="100" height="38" rx="8" fill="#EF4444"/>
  <!-- Car body upper (cabin) -->
  <rect x="26" y="46" width="68" height="34" rx="10" fill="#F87171"/>
  <!-- Windshield front -->
  <rect x="78" y="50" width="14" height="24" rx="4" fill="#BAE6FD" opacity="0.85"/>
  <!-- Window rear -->
  <rect x="30" y="50" width="18" height="24" rx="4" fill="#BAE6FD" opacity="0.85"/>
  <!-- Side window -->
  <rect x="52" y="50" width="22" height="24" rx="4" fill="#7DD3FC" opacity="0.85"/>
  <!-- Door line -->
  <line x1="52" y1="50" x2="52" y2="80" stroke="#DC2626" stroke-width="2"/>
  <!-- Headlights -->
  <rect x="96" y="70" width="12" height="8" rx="3" fill="#FDE68A"/>
  <rect x="96" y="70" width="12" height="8" rx="3" fill="white" opacity="0.5"/>
  <!-- Taillights -->
  <rect x="12" y="70" width="10" height="8" rx="3" fill="#FCA5A5"/>
  <!-- Wheels -->
  <circle cx="32" cy="106" r="16" fill="#374151"/>
  <circle cx="88" cy="106" r="16" fill="#374151"/>
  <circle cx="32" cy="106" r="9" fill="#6B7280"/>
  <circle cx="88" cy="106" r="9" fill="#6B7280"/>
  <circle cx="32" cy="106" r="4" fill="#9CA3AF"/>
  <circle cx="88" cy="106" r="4" fill="#9CA3AF"/>
  <!-- Chrome trim -->
  <rect x="10" y="82" width="100" height="4" rx="2" fill="#FCA5A5" opacity="0.5"/>
  <!-- Door handle -->
  <rect x="64" y="67" width="8" height="3" rx="1.5" fill="#DC2626"/>
</svg>
