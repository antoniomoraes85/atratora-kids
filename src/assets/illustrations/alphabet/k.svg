<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Kite tail -->
  <path d="M60 90 Q70 100 60 110 Q50 120 60 130" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Bows on tail -->
  <path d="M56 100 L64 96 L64 104 Z" fill="#3B82F6"/>
  <path d="M64 100 L56 96 L56 104 Z" fill="#3B82F6"/>
  <path d="M56 110 L64 106 L64 114 Z" fill="#22C55E"/>
  <path d="M64 110 L56 106 L56 114 Z" fill="#22C55E"/>
  
  <!-- Kite diamond -->
  <polygon points="60,10 90,40 60,90 30,40" fill="#FBBF24"/>
  <!-- Kite panels -->
  <polygon points="60,10 90,40 60,40" fill="#EF4444"/>
  <polygon points="60,10 60,40 30,40" fill="#3B82F6"/>
  <polygon points="60,40 90,40 60,90" fill="#22C55E"/>
  <!-- Kite frame/sticks -->
  <line x1="60" y1="10" x2="60" y2="90" stroke="#FDE68A" stroke-width="2"/>
  <line x1="30" y1="40" x2="90" y2="40" stroke="#FDE68A" stroke-width="2"/>
</svg>
