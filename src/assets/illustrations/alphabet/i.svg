<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="34" ry="4" fill="#0F172A" opacity="0.12"/>
  <!-- Igloo body -->
  <ellipse cx="60" cy="86" rx="46" ry="30" fill="#BFDBFE"/>
  <!-- Igloo dome -->
  <ellipse cx="60" cy="68" rx="44" ry="44" fill="#DBEAFE" clip-path="url(#dome-clip)"/>
  <defs>
    <clipPath id="dome-clip">
      <rect x="0" y="0" width="120" height="80"/>
    </clipPath>
  </defs>
  <!-- Igloo blocks pattern -->
  <!-- Row 3 (top) -->
  <path d="M44 44 Q60 18 76 44" stroke="#93C5FD" stroke-width="2" fill="none"/>
  <line x1="60" y1="18" x2="60" y2="44" stroke="#93C5FD" stroke-width="2"/>
  <!-- Row 2 -->
  <path d="M22 66 Q42 50 60 50 Q78 50 98 66" stroke="#93C5FD" stroke-width="2" fill="none"/>
  <line x1="42" y1="51" x2="38" y2="66" stroke="#93C5FD" stroke-width="2"/>
  <line x1="60" y1="50" x2="60" y2="66" stroke="#93C5FD" stroke-width="2"/>
  <line x1="78" y1="51" x2="82" y2="66" stroke="#93C5FD" stroke-width="2"/>
  <!-- Row 1 (base) -->
  <line x1="14" y1="86" x2="106" y2="86" stroke="#93C5FD" stroke-width="2"/>
  <line x1="30" y1="86" x2="28" y2="100" stroke="#93C5FD" stroke-width="2"/>
  <line x1="50" y1="86" x2="50" y2="100" stroke="#93C5FD" stroke-width="2"/>
  <line x1="70" y1="86" x2="70" y2="100" stroke="#93C5FD" stroke-width="2"/>
  <line x1="90" y1="86" x2="92" y2="100" stroke="#93C5FD" stroke-width="2"/>
  <!-- Entrance tunnel -->
  <rect x="46" y="88" width="28" height="18" rx="0" fill="#1E3A5F"/>
  <ellipse cx="60" cy="88" rx="14" ry="6" fill="#1E3A5F"/>
  <!-- Snow ground -->
  <ellipse cx="60" cy="104" rx="46" ry="8" fill="#EFF6FF"/>
  <!-- Shine on dome -->
  <ellipse cx="44" cy="50" rx="12" ry="8" fill="white" opacity="0.3"/>
</svg>
