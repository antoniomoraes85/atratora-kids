<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Water bubbles background hint -->
  <circle cx="20" cy="30" r="5" fill="#BAE6FD" opacity="0.5"/>
  <circle cx="100" cy="50" r="7" fill="#BAE6FD" opacity="0.4"/>
  <circle cx="15" cy="80" r="4" fill="#BAE6FD" opacity="0.4"/>
  <!-- Tail fin -->
  <polygon points="108,52 120,38 120,66" fill="#0EA5E9"/>
  <!-- Body -->
  <ellipse cx="56" cy="62" rx="38" ry="22" fill="#38BDF8"/>
  <!-- Belly -->
  <ellipse cx="56" cy="66" rx="26" ry="13" fill="#BAE6FD"/>
  <!-- Scales pattern -->
  <ellipse cx="46" cy="56" rx="7" ry="5" fill="#0EA5E9" opacity="0.4"/>
  <ellipse cx="62" cy="54" rx="7" ry="5" fill="#0EA5E9" opacity="0.4"/>
  <ellipse cx="78" cy="56" rx="7" ry="5" fill="#0EA5E9" opacity="0.4"/>
  <ellipse cx="54" cy="64" rx="7" ry="5" fill="#0EA5E9" opacity="0.3"/>
  <ellipse cx="70" cy="62" rx="7" ry="5" fill="#0EA5E9" opacity="0.3"/>
  <!-- Dorsal fin -->
  <polygon points="56,40 44,52 68,52" fill="#0EA5E9"/>
  <!-- Head -->
  <circle cx="22" cy="60" r="20" fill="#38BDF8"/>
  <!-- Eye -->
  <circle cx="16" cy="54" r="7" fill="white"/>
  <circle cx="16" cy="54" r="4" fill="#1E293B"/>
  <circle cx="14.5" cy="52.5" r="1.5" fill="white"/>
  <!-- Mouth smile -->
  <path d="M8 62 Q14 70 22 66" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheek -->
  <ellipse cx="22" cy="62" rx="5" ry="3.5" fill="#7DD3FC" opacity="0.6"/>
  <!-- Pectoral fins -->
  <ellipse cx="42" cy="76" rx="14" ry="7" fill="#0EA5E9" transform="rotate(20 42 76)"/>
  <ellipse cx="52" cy="78" rx="12" ry="6" fill="#38BDF8" transform="rotate(20 52 78)"/>
