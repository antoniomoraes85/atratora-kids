<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="30" ry="4" fill="#0F172A" opacity="0.12"/>
  <!-- Body -->
  <rect x="28" y="48" width="64" height="60" rx="8" fill="#64748B"/>
  <!-- Chest plate -->
  <rect x="36" y="58" width="48" height="32" rx="6" fill="#475569"/>
  <!-- Chest buttons -->
  <circle cx="48" cy="66" r="5" fill="#22D3EE"/>
  <circle cx="60" cy="66" r="5" fill="#F43F5E"/>
  <circle cx="72" cy="66" r="5" fill="#A3E635"/>
  <!-- Chest display panel -->
  <rect x="38" y="76" width="44" height="10" rx="3" fill="#1E293B"/>
  <rect x="40" y="78" width="10" height="6" rx="2" fill="#22D3EE" opacity="0.8"/>
  <rect x="52" y="78" width="10" height="6" rx="2" fill="#22D3EE" opacity="0.5"/>
  <rect x="64" y="78" width="10" height="6" rx="2" fill="#22D3EE" opacity="0.3"/>
  <!-- Head -->
  <rect x="34" y="20" width="52" height="36" rx="10" fill="#94A3B8"/>
  <!-- Eyes (LED) -->
  <rect x="42" y="30" width="14" height="10" rx="3" fill="#22D3EE"/>
  <rect x="64" y="30" width="14" height="10" rx="3" fill="#22D3EE"/>
  <!-- Eye glow -->
  <ellipse cx="49" cy="35" rx="4" ry="3" fill="white" opacity="0.4"/>
  <ellipse cx="71" cy="35" rx="4" ry="3" fill="white" opacity="0.4"/>
  <!-- Antenna -->
  <rect x="57" y="8" width="6" height="14" rx="3" fill="#64748B"/>
  <circle cx="60" cy="8" r="5" fill="#F59E0B"/>
  <!-- Mouth -->
  <rect x="42" y="46" width="36" height="6" rx="3" fill="#334155"/>
  <rect x="44" y="47" width="8" height="4" rx="1" fill="#22D3EE" opacity="0.6"/>
  <rect x="54" y="47" width="8" height="4" rx="1" fill="#22D3EE" opacity="0.6"/>
  <rect x="64" y="47" width="8" height="4" rx="1" fill="#22D3EE" opacity="0.6"/>
  <!-- Arms -->
  <rect x="8" y="52" width="20" height="44" rx="10" fill="#64748B"/>
  <rect x="92" y="52" width="20" height="44" rx="10" fill="#64748B"/>
  <!-- Hand claws -->
  <ellipse cx="18" cy="100" rx="8" ry="6" fill="#475569"/>
  <ellipse cx="102" cy="100" rx="8" ry="6" fill="#475569"/>
  <!-- Legs -->
  <rect x="34" y="104" width="20" height="14" rx="4" fill="#475569"/>
  <rect x="66" y="104" width="20" height="14" rx="4" fill="#475569"/>
