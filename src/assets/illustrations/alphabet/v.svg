<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Body -->
  <ellipse cx="60" cy="80" rx="34" ry="26" fill="#ECFDF5"/>
  <!-- White belly -->
  <ellipse cx="60" cy="82" rx="22" ry="18" fill="white"/>
  <!-- Spots on body -->
  <circle cx="42" cy="78" r="6" fill="#6EE7B7" opacity="0.6"/>
  <circle cx="75" cy="74" r="5" fill="#6EE7B7" opacity="0.6"/>
  <circle cx="58" cy="92" r="5" fill="#6EE7B7" opacity="0.6"/>
  <!-- Head -->
  <ellipse cx="60" cy="47" rx="24" ry="20" fill="#ECFDF5"/>
  <!-- Snout -->
  <ellipse cx="60" cy="55" rx="14" ry="9" fill="white"/>
  <!-- Nostrils -->
  <ellipse cx="55" cy="54" rx="3" ry="2.5" fill="#E2E8F0"/>
  <ellipse cx="65" cy="54" rx="3" ry="2.5" fill="#E2E8F0"/>
  <circle cx="55" cy="54" r="1.5" fill="#475569"/>
  <circle cx="65" cy="54" r="1.5" fill="#475569"/>
  <!-- Eyes -->
  <circle cx="50" cy="41" r="6" fill="#1E293B"/>
  <circle cx="70" cy="41" r="6" fill="#1E293B"/>
  <circle cx="51.5" cy="39.5" r="2.5" fill="white"/>
  <circle cx="71.5" cy="39.5" r="2.5" fill="white"/>
  <!-- Horns on head -->
  <ellipse cx="48" cy="30" rx="4" ry="7" fill="#ECFDF5" transform="rotate(-10 48 30)"/>
  <ellipse cx="72" cy="30" rx="4" ry="7" fill="#ECFDF5" transform="rotate(10 72 30)"/>
  <!-- Mouth -->
  <path d="M53 60 Q60 66 67 60" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="34" y="98" width="12" height="16" rx="6" fill="#ECFDF5"/>
  <rect x="74" y="98" width="12" height="16" rx="6" fill="#ECFDF5"/>
  <!-- Hooves -->
  <ellipse cx="40" cy="114" rx="7" ry="4" fill="#475569"/>
  <ellipse cx="80" cy="114" rx="7" ry="4" fill="#475569"/>
  <!-- Tail -->
  <path d="M94 76 Q110 64 106 52" stroke="#ECFDF5" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M106 52 Q108 46 114 48" stroke="#ECFDF5" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Bell on neck (Swiss cow style) -->
  <rect x="50" y="64" width="20" height="10" rx="2" fill="#FBBF24"/>
  <ellipse cx="60" cy="75" rx="4" ry="3" fill="#D97706"/>
</svg>
