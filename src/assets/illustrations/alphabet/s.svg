<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Back legs -->
  <ellipse cx="28" cy="92" rx="10" ry="20" fill="#4ADE80" transform="rotate(-30 28 92)"/>
  <ellipse cx="92" cy="92" rx="10" ry="20" fill="#4ADE80" transform="rotate(30 92 92)"/>
  <!-- Body -->
  <ellipse cx="60" cy="75" rx="32" ry="24" fill="#22C55E"/>
  <!-- Belly -->
  <ellipse cx="60" cy="80" rx="22" ry="15" fill="#86EFAC"/>
  <!-- Head (wide frog shape) -->
  <ellipse cx="60" cy="48" rx="30" ry="22" fill="#22C55E"/>
  <!-- Eyes (on top of head, bulging) -->
  <circle cx="40" cy="36" r="12" fill="#22C55E"/>
  <circle cx="80" cy="36" r="12" fill="#22C55E"/>
  <circle cx="40" cy="36" r="8" fill="white"/>
  <circle cx="80" cy="36" r="8" fill="white"/>
  <circle cx="40" cy="36" r="5" fill="#1E293B"/>
  <circle cx="80" cy="36" r="5" fill="#1E293B"/>
  <circle cx="38.5" cy="34.5" r="2" fill="white"/>
  <circle cx="78.5" cy="34.5" r="2" fill="white"/>
  <!-- Mouth wide smile -->
  <path d="M38 58 Q60 72 82 58" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nostrils -->
  <circle cx="54" cy="52" r="2.5" fill="#166534"/>
  <circle cx="66" cy="52" r="2.5" fill="#166534"/>
  <!-- Spots -->
  <circle cx="48" cy="74" r="5" fill="#16A34A" opacity="0.5"/>
  <circle cx="72" cy="72" r="4" fill="#16A34A" opacity="0.5"/>
  <!-- Front legs/hands -->
  <ellipse cx="34" cy="78" rx="8" ry="12" fill="#4ADE80" transform="rotate(-40 34 78)"/>
  <ellipse cx="86" cy="78" rx="8" ry="12" fill="#4ADE80" transform="rotate(40 86 78)"/>
  <!-- Feet webbed -->
  <path d="M20 106 Q26 116 32 106" stroke="#22C55E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M26 104 L22 116" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 106 Q94 116 100 106" stroke="#22C55E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M94 104 L90 116" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
</svg>
