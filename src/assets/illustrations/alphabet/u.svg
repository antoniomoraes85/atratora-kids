  <ellipse cx="60" cy="82" rx="30" ry="28" fill="#92400E"/>
  <!-- Belly -->
  <ellipse cx="60" cy="88" rx="18" ry="18" fill="#FDE68A"/>
  <!-- Head -->
  <circle cx="60" cy="48" r="26" fill="#92400E"/>
  <!-- Ears -->
  <circle cx="36" cy="28" r="11" fill="#92400E"/>
  <circle cx="84" cy="28" r="11" fill="#92400E"/>
  <circle cx="36" cy="28" r="7" fill="#FCA5A5"/>
  <circle cx="84" cy="28" r="7" fill="#FCA5A5"/>
  <!-- Face snout -->
  <ellipse cx="60" cy="56" rx="14" ry="11" fill="#FDE68A"/>
