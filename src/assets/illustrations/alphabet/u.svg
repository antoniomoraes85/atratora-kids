  <ellipse cx="92" cy="76" rx="10" ry="18" fill="#92400E" transform="rotate(15 92 76)"/>
  <!-- Paws -->
  <circle cx="22" cy="90" r="8" fill="#713F12"/>
  <circle cx="98" cy="90" r="8" fill="#713F12"/>
  <!-- Legs -->
  <ellipse cx="42" cy="108" rx="13" ry="10" fill="#92400E"/>
  <ellipse cx="78" cy="108" rx="13" ry="10" fill="#92400E"/>
  <circle cx="42" cy="115" r="7" fill="#713F12"/>
  <circle cx="78" cy="115" r="7" fill="#713F12"/>
