  <path d="M52 58 Q60 66 68 58" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="42" cy="54" rx="7" ry="5" fill="#F87171" opacity="0.4"/>
