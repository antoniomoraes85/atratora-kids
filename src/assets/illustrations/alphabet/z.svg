  <!-- Legs -->
  <rect x="34" y="98" width="11" height="18" rx="5" fill="white"/>
  <path d="M34 100 L45 100 L45 116 L34 116" fill="none" stroke="#1E293B" stroke-width="3"/>
  <rect x="48" y="100" width="11" height="16" rx="5" fill="white"/>
