  <path d="M64 57 Q68 80 64 104" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M76 58 Q80 80 76 102" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
