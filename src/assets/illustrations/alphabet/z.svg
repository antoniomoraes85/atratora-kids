  <ellipse cx="36" cy="34" rx="5" ry="8" fill="white"/>
  <path d="M32 28 L36 24 L40 28" fill="#1E293B"/>
  <ellipse cx="36" cy="34" rx="2.5" ry="5" fill="#FCA5A5"/>
