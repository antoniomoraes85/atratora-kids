  <ellipse cx="40" cy="114" rx="7" ry="4" fill="#374151"/>
  <ellipse cx="54" cy="114" rx="7" ry="4" fill="#374151"/>
  <ellipse cx="70" cy="114" rx="7" ry="4" fill="#374151"/>
  <ellipse cx="84" cy="114" rx="7" ry="4" fill="#374151"/>
