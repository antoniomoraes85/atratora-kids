<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Body (elongated horse shape) -->
  <ellipse cx="58" cy="76" rx="32" ry="22" fill="#D97706"/>
  <!-- Neck -->
  <ellipse cx="38" cy="60" rx="14" ry="20" fill="#FBBF24" transform="rotate(-20 38 60)"/>
  <!-- Head -->
  <ellipse cx="24" cy="42" rx="16" ry="13" fill="#FBBF24" transform="rotate(-15 24 42)"/>
  <!-- Snout -->
  <ellipse cx="14" cy="46" rx="8" ry="6" fill="#FDE68A" transform="rotate(-15 14 46)"/>
  <circle cx="11" cy="46" r="2" fill="#D97706"/>
  <circle cx="15" cy="49" r="2" fill="#D97706"/>
  <!-- Eye -->
  <circle cx="26" cy="36" r="5" fill="#1E293B"/>
  <circle cx="27.5" cy="34.5" r="2" fill="white"/>
  <!-- Ear -->
  <ellipse cx="32" cy="28" rx="5" ry="8" fill="#FBBF24" transform="rotate(-10 32 28)"/>
  <ellipse cx="32" cy="28" rx="3" ry="5" fill="#FDE68A" transform="rotate(-10 32 28)"/>
  <!-- Mane -->
  <path d="M34 28 Q38 35 36 44 Q40 50 38 58" stroke="#92400E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M36 30 Q42 36 40 45" stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="35" y="92" width="10" height="22" rx="5" fill="#FBBF24"/>
  <rect x="52" y="94" width="10" height="20" rx="5" fill="#FBBF24"/>
  <rect x="70" y="94" width="10" height="20" rx="5" fill="#D97706"/>
  <rect x="84" y="92" width="10" height="22" rx="5" fill="#D97706"/>
  <!-- Hooves -->
  <ellipse cx="40" cy="114" rx="6" ry="4" fill="#374151"/>
  <ellipse cx="57" cy="114" rx="6" ry="4" fill="#374151"/>
  <ellipse cx="75" cy="114" rx="6" ry="4" fill="#374151"/>
  <ellipse cx="89" cy="114" rx="6" ry="4" fill="#374151"/>
  <!-- Tail -->
  <path d="M90 70 Q106 62 108 50 Q110 40 106 36" stroke="#92400E" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
