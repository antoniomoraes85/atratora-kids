  <path d="M56 68 Q44 80 42 96 Q40 104 46 108" stroke="#8B7563" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M46 108 Q52 114 56 108" stroke="#8B7563" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Ears (big) -->
