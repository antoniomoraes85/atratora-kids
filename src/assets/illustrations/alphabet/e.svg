  <ellipse cx="89" cy="42" rx="14" ry="18" fill="#A89080"/>
  <ellipse cx="31" cy="42" rx="9" ry="13" fill="#C4A882"/>
  <ellipse cx="89" cy="42" rx="9" ry="13" fill="#C4A882"/>
  <!-- Eyes -->
