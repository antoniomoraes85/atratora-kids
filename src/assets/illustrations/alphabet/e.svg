  <circle cx="41" cy="116" r="3" fill="#A89080"/>
  <circle cx="79" cy="116" r="3" fill="#A89080"/>
  <circle cx="83" cy="118" r="3" fill="#A89080"/>
  <circle cx="87" cy="116" r="3" fill="#A89080"/>
  <!-- Smile wrinkles -->
  <path d="M50 56 Q60 63 70 56" stroke="#8B7563" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
