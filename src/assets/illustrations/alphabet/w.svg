<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="40" ry="4" fill="#0F172A" opacity="0.12"/>
  <!-- Whale body -->
  <ellipse cx="54" cy="68" rx="48" ry="30" fill="#3B82F6"/>
  <!-- Belly (lighter) -->
  <ellipse cx="54" cy="76" rx="32" ry="18" fill="#93C5FD"/>
  <!-- Tail fluke -->
  <path d="M98 60 Q118 40 114 68 Q110 80 98 72 Z" fill="#2563EB"/>
  <path d="M98 76 Q118 90 112 80 Q106 72 98 72 Z" fill="#2563EB"/>
  <!-- Dorsal fin -->
  <path d="M58 38 Q68 14 76 36" fill="#2563EB"/>
  <!-- Pectoral fin -->
  <path d="M32 74 Q16 90 18 104 Q30 100 42 84 Z" fill="#2563EB"/>
  <!-- Eye -->
  <circle cx="30" cy="60" r="8" fill="white"/>
  <circle cx="30" cy="60" r="5" fill="#1E293B"/>
  <circle cx="28" cy="58" r="2" fill="white"/>
  <!-- Mouth / smile -->
  <path d="M14 68 Q24 80 36 74" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blowhole spout -->
  <path d="M52 38 Q48 22 52 14" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M52 38 Q58 20 60 12" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M52 38 Q44 24 42 16" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Shine on body -->
  <ellipse cx="40" cy="52" rx="16" ry="8" fill="white" opacity="0.15"/>
</svg>
