<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Ground shadow -->
  <ellipse cx="60" cy="116" rx="40" ry="4" fill="#0F172A" opacity="0.10"/>
  <!-- Sky background (gradient feel) -->
  <rect x="4" y="4" width="112" height="112" rx="12" fill="#EFF6FF" opacity="0.5"/>
  <!-- Big fluffy cloud (center) -->
  <circle cx="60" cy="60" r="28" fill="white"/>
  <circle cx="38" cy="68" r="20" fill="white"/>
  <circle cx="82" cy="68" r="20" fill="white"/>
  <circle cx="44" cy="56" r="16" fill="white"/>
  <circle cx="76" cy="56" r="16" fill="white"/>
  <!-- Cloud base fill -->
  <rect x="18" y="68" width="84" height="20" fill="white"/>
  <!-- Cloud shadow underside -->
  <ellipse cx="60" cy="88" rx="44" ry="8" fill="#DBEAFE" opacity="0.6"/>
  <!-- Shine / highlight -->
  <circle cx="46" cy="52" r="10" fill="white" opacity="0.6"/>
  <!-- Small cloud left -->
  <circle cx="20" cy="38" r="10" fill="white" opacity="0.8"/>
  <circle cx="32" cy="36" r="8" fill="white" opacity="0.8"/>
  <!-- Small cloud right -->
  <circle cx="96" cy="34" r="10" fill="white" opacity="0.8"/>
  <circle cx="86" cy="36" r="8" fill="white" opacity="0.8"/>
  <!-- Rain drops -->
  <ellipse cx="34" cy="104" rx="3" ry="6" fill="#93C5FD" opacity="0.7"/>
  <ellipse cx="50" cy="108" rx="3" ry="6" fill="#93C5FD" opacity="0.7"/>
  <ellipse cx="66" cy="106" rx="3" ry="6" fill="#93C5FD" opacity="0.7"/>
  <ellipse cx="82" cy="104" rx="3" ry="6" fill="#93C5FD" opacity="0.7"/>
</svg>
