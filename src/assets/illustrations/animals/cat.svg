  <circle cx="69" cy="40" r="5" fill="#1E293B"/>
  <circle cx="52.5" cy="38.5" r="2" fill="white"/>
  <circle cx="70.5" cy="38.5" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="60" cy="49" rx="3" ry="2" fill="#F9A8D4"/>
