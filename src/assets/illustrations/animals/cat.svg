  <line x1="36" y1="56" x2="52" y2="56" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="54" x2="84" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="56" x2="84" y2="56" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M55 55 Q60 60 65 55" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <ellipse cx="44" cy="50" rx="5" ry="3.5" fill="#F9A8D4" opacity="0.5"/>
  <ellipse cx="76" cy="50" rx="5" ry="3.5" fill="#F9A8D4" opacity="0.5"/>
  <!-- Tail -->
  <path d="M88 72 Q106 55 98 44" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Paws -->
  <ellipse cx="43" cy="99" rx="9" ry="7" fill="#94A3B8"/>
  <ellipse cx="77" cy="99" rx="9" ry="7" fill="#94A3B8"/>
  <!-- Paw pads -->
  <ellipse cx="43" cy="101" rx="5" ry="3.5" fill="#F9A8D4"/>
  <ellipse cx="77" cy="101" rx="5" ry="3.5" fill="#F9A8D4"/>
