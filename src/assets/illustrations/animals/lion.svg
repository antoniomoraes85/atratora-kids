  <ellipse cx="80" cy="100" rx="10" ry="8" fill="#FBBF24"/>
  <!-- Tail -->
  <path d="M90 80 Q112 70 108 54" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="106" cy="51" r="7" fill="#D97706"/>
