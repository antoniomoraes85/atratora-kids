  <ellipse cx="60" cy="82" rx="30" ry="26" fill="#FBBF24"/>
  <!-- Head -->
  <circle cx="60" cy="48" r="26" fill="#FBBF24"/>
  <!-- Inner mane -->
  <circle cx="60" cy="48" r="20" fill="#FBBF24"/>
  <!-- Muzzle -->
  <ellipse cx="60" cy="55" rx="13" ry="10" fill="#FDE68A"/>
  <!-- Eyes -->
  <circle cx="51" cy="43" r="5.5" fill="#1E293B"/>
  <circle cx="69" cy="43" r="5.5" fill="#1E293B"/>
  <circle cx="49" cy="41" r="2.5" fill="#FBBF24"/>
  <circle cx="67" cy="41" r="2.5" fill="#FBBF24"/>
  <circle cx="50" cy="42" r="1.5" fill="white"/>
  <circle cx="68" cy="42" r="1.5" fill="white"/>
  <!-- Nose -->
  <path d="M55 51 L65 51 L60 55 Z" fill="#D97706"/>
  <!-- Mouth -->
  <path d="M53 56 Q60 63 67 56" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
