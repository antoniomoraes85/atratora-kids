<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Shell dome -->
  <ellipse cx="60" cy="66" rx="40" ry="30" fill="#16A34A"/>
  <!-- Shell hexagonal pattern -->
  <hexagon/>
  <circle cx="60" cy="60" r="14" fill="#15803D" opacity="0.7"/>
  <ellipse cx="38" cy="58" rx="10" ry="8" fill="#15803D" opacity="0.7"/>
  <ellipse cx="82" cy="58" rx="10" ry="8" fill="#15803D" opacity="0.7"/>
  <ellipse cx="50" cy="76" rx="10" ry="8" fill="#15803D" opacity="0.7"/>
  <ellipse cx="70" cy="76" rx="10" ry="8" fill="#15803D" opacity="0.7"/>
  <!-- Shell outline highlights -->
  <ellipse cx="60" cy="66" rx="40" ry="30" stroke="#166534" stroke-width="2" fill="none"/>
  <!-- Shell grid lines -->
  <line x1="60" y1="36" x2="60" y2="96" stroke="#166534" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="60" x2="100" y2="66" stroke="#166534" stroke-width="1.5" opacity="0.4"/>
  <line x1="30" y1="42" x2="88" y2="88" stroke="#166534" stroke-width="1.5" opacity="0.4"/>
  <line x1="88" y1="42" x2="30" y2="88" stroke="#166534" stroke-width="1.5" opacity="0.4"/>
  <!-- Head -->
  <circle cx="60" cy="36" r="16" fill="#4ADE80"/>
  <!-- Eyes -->
  <circle cx="53" cy="31" r="5" fill="#1E293B"/>
  <circle cx="67" cy="31" r="5" fill="#1E293B"/>
  <circle cx="54.5" cy="29.5" r="2" fill="white"/>
  <circle cx="68.5" cy="29.5" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M52 40 Q60 47 68 40" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Snout -->
  <ellipse cx="60" cy="38" rx="6" ry="4" fill="#86EFAC"/>
  <!-- Nostrils -->
  <circle cx="57" cy="37" r="1.5" fill="#166534"/>
  <circle cx="63" cy="37" r="1.5" fill="#166534"/>
  <!-- Feet (4 legs) -->
  <ellipse cx="24" cy="82" rx="10" ry="7" fill="#4ADE80" transform="rotate(-20 24 82)"/>
  <ellipse cx="96" cy="82" rx="10" ry="7" fill="#4ADE80" transform="rotate(20 96 82)"/>
  <ellipse cx="30" cy="100" rx="10" ry="7" fill="#4ADE80" transform="rotate(10 30 100)"/>
  <ellipse cx="90" cy="100" rx="10" ry="7" fill="#4ADE80" transform="rotate(-10 90 100)"/>
  <!-- Toe claws -->
  <circle cx="16" cy="85" r="2.5" fill="#166534"/>
  <circle cx="22" cy="89" r="2.5" fill="#166534"/>
  <circle cx="104" cy="85" r="2.5" fill="#166534"/>
  <circle cx="98" cy="89" r="2.5" fill="#166534"/>
</svg>
